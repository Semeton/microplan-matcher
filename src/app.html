<style>
/* Layout: one quiet column, one step on screen at a time; colour only where something needs attention. */
:root {
  --bg: #f6f7f6; --surface: #ffffff; --ink: #18201d; --muted: #66726d; --faint: #9aa59f; --line: #e3e7e4; --hover: #f0f3f1;
  --accent: #0b6e5f; --accent-ink: #ffffff; --accent-soft: #e3f1ed;
  --ok: #1d7a45; --warn: #a35d00; --err: #b42318;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111614; --surface: #171e1b; --ink: #e6ece9; --muted: #98a59f; --faint: #66736d; --line: #26302c; --hover: #1d2622;
  --accent: #45bca4; --accent-ink: #06150f; --accent-soft: #163029; --ok: #5cc68b; --warn: #e4a647; --err: #f27a6c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111614; --surface: #171e1b; --ink: #e6ece9; --muted: #98a59f; --faint: #66736d; --line: #26302c; --hover: #1d2622;
  --accent: #45bca4; --accent-ink: #06150f; --accent-soft: #163029; --ok: #5cc68b; --warn: #e4a647; --err: #f27a6c; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 72px; display: grid; gap: 28px; }
h1, h2 { margin: 0; font-weight: 600; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 1.5rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 0.85rem; }
.mono { font-family: var(--f-mono); font-size: 0.85em; }

header { display: grid; gap: 4px; }

/* step indicator */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.steps button { all: unset; cursor: pointer; display: grid; gap: 6px; font-size: 0.8rem; color: var(--faint); }
.steps button::before { content: ""; height: 3px; border-radius: 2px; background: var(--line); }
.steps button.done { color: var(--muted); } .steps button.done::before { background: var(--accent); opacity: 0.45; }
.steps button.on { color: var(--ink); font-weight: 600; } .steps button.on::before { background: var(--accent); }
.steps button:disabled { cursor: default; }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 22px; min-width: 0; }
.panel > .intro { display: grid; gap: 6px; }

/* files */
.files { display: grid; gap: 12px; }
.file { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 8px; cursor: pointer; min-width: 0; }
.file:hover, .file.over { border-color: var(--accent); background: var(--hover); }
.file.loaded { border-style: solid; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.file .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; flex: none; color: var(--muted); font-family: var(--f-mono); font-size: 0.72rem; }
.file.loaded .ic { background: var(--accent-soft); color: var(--accent); }
.file .txt { display: grid; min-width: 0; }
.file .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .meta { font-size: 0.84rem; color: var(--muted); }
.file .act { margin-left: auto; font-size: 0.84rem; color: var(--accent); flex: none; }
.example { font-size: 0.86rem; color: var(--muted); }

/* summary list */
.facts { display: grid; gap: 0; border-top: 1px solid var(--line); }
.fact { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.fact .mark { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; font-weight: 600; margin-top: 2px; }
.mark.ok { background: var(--accent-soft); color: var(--accent); }
.mark.warn { background: var(--warn); color: var(--surface); }
.mark.err { background: var(--err); color: var(--surface); }
.fact .t { min-width: 0; overflow-wrap: anywhere; }
.fact .d { font-size: 0.84rem; color: var(--muted); margin-top: 2px; }

details.edit > summary { list-style: none; cursor: pointer; color: var(--accent); font-size: 0.9rem; font-weight: 500; width: fit-content; }
details.edit > summary::-webkit-details-marker { display: none; }
details.edit[open] > summary { margin-bottom: 14px; }
.form { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.row label { font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.row label .mono { color: var(--faint); }
.group-title { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; padding-top: 6px; }
select, input[type="text"] { font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; }

/* buttons */
button { font: inherit; font-size: 0.9rem; font-weight: 500; border-radius: 7px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button:hover:not(:disabled) { background: var(--hover); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* review */
.big { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); }
.queue { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.card .who { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.card .who b { font-weight: 600; }
.card .where { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { font-size: 0.86rem; padding: 6px 12px; }
.choices button .pc { color: var(--faint); font-variant-numeric: tabular-nums; margin-left: 6px; font-size: 0.8rem; }
.choices select { width: auto; max-width: 100%; }
.tag { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.done-state { text-align: center; padding: 18px 0 6px; display: grid; gap: 6px; }

.tbl { overflow-x: auto; }
.card .q { font-weight: 600; }
.card .why { font-size: 0.86rem; color: var(--muted); }
.choice-list { display: grid; gap: 6px; }
button.choice { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; width: 100%; text-align: left; padding: 10px 12px; }
button.choice .nm { font-weight: 500; overflow-wrap: anywhere; }
button.choice .meta { font-family: var(--f-mono); font-size: 0.74rem; color: var(--faint); overflow-wrap: anywhere; }
button.choice.alt { border-style: dashed; color: var(--muted); }
button.choice.alt .nm { font-weight: 400; }
.choice-list input[type="text"] { padding: 10px 12px; }
.rowcards { display: grid; gap: 8px; margin-top: 8px; }
.rowcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.rc-head { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.rc-head > button { margin-left: auto; padding: 2px 6px; }
.rc-ref { font-family: var(--f-mono); font-size: 0.76rem; color: var(--faint); }
.rc-problem { color: var(--err); font-size: 0.84rem; }
.rc-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.rc-fields label, .rc-fields > div { display: grid; gap: 3px; min-width: 0; }
.rc-label { font-size: 0.74rem; color: var(--muted); }
.rc-fields input { width: 100%; }
table.grid td { padding: 4px 6px; vertical-align: middle; }
table.grid input[type="text"] { padding: 5px 7px; font-size: 0.85rem; min-width: 110px; }
table.grid tr:hover td { background: var(--hover); }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 0.8rem; }
td .sub { color: var(--muted); font-size: 0.78rem; }
td select { min-width: 200px; }

.modes { display: inline-flex; background: var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.modes button:hover:not([aria-pressed="true"]) { background: transparent; color: var(--ink); }
.demo-table td { vertical-align: middle; }
.demo-table input[type="number"] { width: 64px; font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.demo-table td.role { font-weight: 500; }
.demo-table tr.off td:not(:first-child) { opacity: 0.4; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.settings .field { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.status { font-size: 0.86rem; color: var(--muted); min-height: 1.4em; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 7px; font-size: 0.88rem; max-width: calc(100% - 32px); z-index: 10; }
footer { font-size: 0.8rem; color: var(--faint); text-align: center; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; padding-block: 24px 56px; } .panel { padding: 20px 16px; } .row { grid-template-columns: 1fr; gap: 4px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h1>Microplan Matcher</h1>
      <div class="modes" id="modes" role="group" aria-label="Mode">
        <button type="button" data-mode="plan" aria-pressed="true">From microplan</button>
        <button type="button" data-mode="demo" aria-pressed="false">Demo users</button>

  <main id="view" class="panel" aria-live="polite"></main>

<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('en-US'));
const tick = () => new Promise((r) => setTimeout(r, 0));
const pluralWord = (w) => (/[^aeiou]y$/i.test(w) ? w.slice(0, -1) + 'ies' : /(s|x|ch|sh)$/i.test(w) ? w + 'es' : w + 's');
const plural = (n, w, p) => `${fmt(n)} ${n === 1 ? w : (p || pluralWord(w))}`;

const S = {
  step: 1, example: false, busy: '',
  tplBuf: null, tplName: '', tree: null, facts: null,
  mpName: '', mpSheets: [], analyses: [],
  cfg: { sheet: null, extra: [], levelMap: {}, targetMap: {}, splitMode: 'flag', userSheet: null, person: {}, userLevelMap: {}, roleMap: {}, phoneFmt: '11', empType: '', skipBadUsers: true },
  aliases: {}, res: null, showAuto: false, exportMsg: '',
  mode: 'plan', demo: null, demoMsg: '',
  mpOrig: [], edits: { patches: {}, removed: new Set(), added: {}, log: [], seq: 0 }, acks: new Set(), open: {},
};
function initDemo() {
  if (!S.tree) { S.demo = null; return; }
  const roles = S.facts.roleOptions.length ? S.facts.roleOptions : (S.demo ? S.demo.rows.map((r) => r.role) : []);
  const hf = S.tree.levelLabels.findIndex((l) => MP.hierKind(l) === 'hf');
  S.demo = {
    rows: roles.map((role) => ({ role, include: true, level: MP.defaultRoleLevel(S.tree, role), count: 2 })),
    allRoles: { on: true, level: hf >= 0 ? hf : Math.min(S.tree.depth, 4), count: 1 },
    prefix: 'Demo', phoneStart: '09099990001',
    empType: S.facts.employmentOptions.find((x) => /temp/i.test(x)) || S.facts.employmentOptions[0] || 'Temporary',
  };
}
function demoPlan() {
  const D = S.demo;
  return { prefix: D.prefix, phoneStart: D.phoneStart, allRoles: D.allRoles.on ? { level: D.allRoles.level, count: D.allRoles.count } : null,
    roles: D.rows.filter((r) => r.include).map((r) => ({ role: r.role, level: r.level, count: r.count })) };
}

// ───────── storage (per-viewer convenience only) ─────────
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* unavailable */ } },
};
const aliasStoreKey = () => 'mpm.aliases.' + (S.tree && S.tree.roots[0] || 'x');
function loadAliases() { S.aliases = S.example ? {} : (store.get(aliasStoreKey()) || {}); }
function saveAliases() { if (!S.example) store.set(aliasStoreKey(), S.aliases); }

// ───────── downloads ─────────
const dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveFile(filename, blob) {
  const dl = await dlPromise;
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Saved ' + filename); return; }
    catch (e) { if (e && e.code === 'declined') { toast('Save cancelled'); return; } if (e && e.code === 'rate_limited') { toast('A save prompt is already open'); return; } }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3000); }

// ───────── loading ─────────
function sheetsFromXLSX(buf, keepBlank) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  return wb.SheetNames.map((name, i) => ({
    name, hidden: !!(wb.Workbook && wb.Workbook.Sheets && wb.Workbook.Sheets[i] && wb.Workbook.Sheets[i].Hidden),
    rows: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: '', blankrows: keepBlank !== false }),
  }));
}
async function loadTemplate(buf, name) {
  S.tplBuf = buf; S.tplName = name;
  S.tree = MP.parseTemplate(sheetsFromXLSX(buf, false));
  const ewb = new ExcelJS.Workbook(); await ewb.xlsx.load(buf);
  S.facts = MPW.templateFacts(ewb);
  loadAliases();
}
async function loadMicroplan(buf, name) {
  S.mpName = name; S.mpOrig = sheetsFromXLSX(buf, true);
  S.edits = { patches: {}, removed: new Set(), added: {}, log: [], seq: 0 }; S.acks = new Set(); S.open = {};
  applyEdits();
}
// The engine always reads S.mpSheets: the original workbook with cell edits, removed rows and added rows applied.
function applyEdits() {
  const E = S.edits;
  S.mpSheets = S.mpOrig.map((sh) => ({ name: sh.name, hidden: sh.hidden,
    rows: sh.rows.concat(E.added[sh.name] || []).map((r, ri) => {
      if (E.removed.has(sh.name + '!' + (ri + 1))) return [];
      const pt = E.patches[sh.name + '|' + ri]; if (!pt) return r;
      const c = (r || []).slice(); for (const k of Object.keys(pt)) c[k] = pt[k]; return c;
    }) }));
}
const parseRef = (ref) => { const i = ref.lastIndexOf('!'); return { sheet: ref.slice(0, i), ri: Number(ref.slice(i + 1)) - 1 }; };
const cellAt = (sheet, ri, col) => { const sh = S.mpSheets.find((x) => x.name === sheet); return sh ? MP.cellStr((sh.rows[ri] || [])[col]) : ''; };

function analyse() {
  const labels = S.tree ? S.tree.levelLabels : [];
  S.analyses = S.mpSheets.map((sh) => MP.analyseSheet(sh, labels)).map((a, i) => a && Object.assign(a, { idx: i }));
  const cands = S.analyses.filter((a) => a && a.cols.filter((c) => c.kind).length >= 2);
  const boundaryC = cands.filter((a) => !(a.person.name && a.person.phone));
  const userC = cands.filter((a) => a.person.name && a.person.phone);
  const best = boundaryC.sort((a, b) => b.nRows - a.nRows)[0];
  S.cfg.sheet = best ? best.sheet : null; S.cfg.extra = [];
  S.cfg.userSheet = userC.length ? userC.sort((a, b) => b.nRows - a.nRows)[0].sheet : null;
  setupBoundarySheet(); setupUserSheet();
}
const A = (name) => S.analyses.find((a) => a && a.sheet === name);
function setupBoundarySheet() {
  const a = A(S.cfg.sheet); if (!a || !S.tree) { S.cfg.levelMap = {}; S.cfg.targetMap = {}; return; }
  S.cfg.levelMap = MP.autoLevelMap(a, S.tree);
  const vc = MP.suggestValueCols(a, S.facts.targetKeys);
  S.cfg.targetMap = {};
  for (const t of S.facts.targetKeys) { const hit = vc.find((v) => v.guess === t.key); S.cfg.targetMap[t.key] = hit ? hit.c : ''; }
}
function setupUserSheet(keepPerson) {
  const a = A(S.cfg.userSheet); if (!a || !S.tree) { S.cfg.person = {}; S.cfg.userLevelMap = {}; S.cfg.roleMap = {}; return; }
  S.cfg.userLevelMap = MP.autoLevelMap(a, S.tree);
  if (!keepPerson) S.cfg.person = { name: a.person.name ? a.person.name.c : '', phone: a.person.phone ? a.person.phone.c : '', role: a.person.role ? a.person.role.c : '' };
  const sh = S.mpSheets.find((s) => s.name === S.cfg.userSheet);
  const roles = new Set();
  if (S.cfg.person.role !== '' && S.cfg.person.role != null) for (let r = a.headerRow + 1; r < sh.rows.length; r++) { const v = MP.cellStr((sh.rows[r] || [])[S.cfg.person.role]); if (v) roles.add(v); }
  S.cfg.roleMap = {};
  Array.from(roles).slice(0, 60).forEach((d) => (S.cfg.roleMap[d] = MPW.guessRole(d, S.facts.roleOptions) || ''));
  if (!S.cfg.empType) S.cfg.empType = S.facts.employmentOptions.find((x) => /temp/i.test(x)) || S.facts.employmentOptions[0] || 'Temporary';
}

// ───────── matching ─────────
function run() {
  if (!S.tree || !S.cfg.sheet) { S.res = null; return; }
  const a = A(S.cfg.sheet);
  const valueCols = Array.from(new Set(Object.values(S.cfg.targetMap).filter((v) => v !== '' && v != null).map(Number)));
  const recs = []; const seen = new Set();
  for (const name of [S.cfg.sheet].concat(S.cfg.extra)) {
    const an = A(name); const sh = S.mpSheets.find((s) => s.name === name);
    const primary = name === S.cfg.sheet;
    const lm = primary ? S.cfg.levelMap : remapByLabel(an, a, S.cfg.levelMap);
    const vc = primary ? valueCols : valueCols.map((c) => colByLabel(an, a, c));
    for (const r of MP.extractRecords(sh, an, lm, vc.filter((c) => c != null))) {
      const k = (r.path || []).map((p) => MP.canon(p.name)).join('/');
      if (!primary) { if (seen.has(k)) continue; const v2 = {}; valueCols.forEach((c, i) => { const cc = vc[i]; if (cc != null && r.values[cc] !== undefined) v2[c] = r.values[cc]; }); r.values = v2; }
      seen.add(k); recs.push(r);
    }
  }
  const { matched, decisions } = MP.matchRecords(S.tree, recs, S.aliases);
  const agg = MP.aggregate(S.tree, matched, valueCols, { liftSingle: S.cfg.liftSingle });
  let users = [], uDecisions = [];
  if (S.cfg.userSheet && S.cfg.person.name !== '' && S.cfg.person.phone !== '') {

    try { const buf = await f.arrayBuffer(); if (t.id === 'fileTpl') { await loadTemplate(buf, f.name); initDemo(); S.demoMsg = ''; } else await loadMicroplan(buf, f.name); if (ready()) { analyse(); run(); } S.busy = ''; }
    catch (err) { console.error(err); S.busy = `Could not read ${f.name}. ${err && err.message ? err.message : ''}`; }
    render(); return;
  }
  if (t.id === 'impAlias' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); Object.assign(S.aliases, j.aliases || {}); saveAliases(); run(); render(); toast(`Imported ${plural(Object.keys(j.aliases || {}).length, 'decision')}`); }
    catch (err) { toast('That file is not a decisions export'); }
    return;
  }
  if (t.dataset.qsearch !== undefined) {
    const d = S._q[Number(t.dataset.qsearch)]; const v = t.value.trim(); if (!v) return;
    const all = parentCodeList(d).flatMap((pc) => descendants(pc, d.level));
    const hit = all.find((n) => n.name + ' — ' + n.code === v) || (all.filter((n) => n.name.toLowerCase() === v.toLowerCase()).length === 1 ? all.find((n) => n.name.toLowerCase() === v.toLowerCase()) : null);
    if (hit) { S.open['search:' + d.key] = false; decide(d, hit.code); } else toast('Pick a name from the list');
    return;
  }
  if (t.dataset.auto !== undefined) {
    const d = S._auto[Number(t.dataset.auto)];
    if (t.value === '__ALL__') {
      const all = []; for (const pc of parentCodeList(d)) all.push(...descendants(pc, d.level));
      all.sort((x, y) => x.name.localeCompare(y.name));
      t.innerHTML = `<option value="">Choose (${all.length})</option>` + all.map((n) => opt(n.code, n.name, '')).join('') + opt('__SKIP__', 'Not in the template (skip)', '');
      t.focus(); return;
    }
    if (t.value) decide(d, t.value);
    return;
  }
  // row edits on the export step
  if (t.dataset.cell !== undefined) { const [sheet, ri, col, kind] = t.dataset.cell.split('|'); editCell(sheet, Number(ri), Number(col), kind, t.value); return; }
  // demo settings
  if (S.mode === 'demo' && S.demo) {
    const D = S.demo; const n = (v) => Math.max(0, Math.min(50, parseInt(v, 10) || 0));
    if (t.dataset.dinc !== undefined) D.rows[t.dataset.dinc].include = t.checked;
    else if (t.dataset.dlvl !== undefined) D.rows[t.dataset.dlvl].level = Number(t.value);
    else if (t.dataset.dcnt !== undefined) D.rows[t.dataset.dcnt].count = n(t.value);
    else if (t.id === 'dAllOn') D.allRoles.on = t.checked;
    else if (t.id === 'dAllLvl') D.allRoles.level = Number(t.value);
    else if (t.id === 'dAllCnt') D.allRoles.count = n(t.value);
    else if (t.id === 'dPrefix') D.prefix = t.value || 'Demo';
    else if (t.id === 'dPhone') D.phoneStart = t.value.replace(/\D/g, '');
    else if (t.id === 'dEmp') D.empType = t.value;
    else if (t.id === 'dAddRole') { const r = t.value.trim(); if (r) D.rows.push({ role: r, include: true, level: MP.defaultRoleLevel(S.tree, r), count: 2 }); }
    else return;
    S.demoMsg = ''; render(); return;
  }
  // column edits
  if (t.id === 'selSheet') { S.cfg.sheet = t.value; setupBoundarySheet(); }
  else if (t.dataset.lvl !== undefined) { if (t.value === '') delete S.cfg.levelMap[t.dataset.lvl]; else S.cfg.levelMap[t.dataset.lvl] = Number(t.value); }
  else if (t.dataset.tgt !== undefined) S.cfg.targetMap[t.dataset.tgt] = t.value;
  else if (t.id === 'selSplit') S.cfg.splitMode = t.value;
  else if (t.id === 'selUser') { S.cfg.userSheet = t.value || null; setupUserSheet(); }
  else if (t.dataset.person) { S.cfg.person[t.dataset.person] = t.value === '' ? '' : Number(t.value); if (t.dataset.person === 'role') setupUserSheet(true); }
  else if (t.dataset.role !== undefined) S.cfg.roleMap[t.dataset.role] = t.value;
  else if (t.id === 'selPhone') S.cfg.phoneFmt = t.value;
  else if (t.id === 'selEmp') S.cfg.empType = t.value;
  else if (t.id === 'skipBad') S.cfg.skipBadUsers = t.checked;
  else return;
  run(); render();
});
function decide(d, code) { S.aliases[d.aliasKey] = code; saveAliases(); run(); render(); }
function descendants(code, level) {
  const out = []; const st = [code];
  while (st.length) { const n = S.tree.nodes.get(st.pop()); if (!n) continue; if (n.level === level) out.push(n); else if (n.level < level) st.push(...n.children); }
  return out;
}

async function fillAndSave(btn) {
  btn.disabled = true; $('expStatus').textContent = 'Writing the template…'; await tick();
  try {
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(S.tplBuf.slice(0));
    const R = S.res;
    const users = R.users.filter((u) => u.code && (!S.cfg.skipBadUsers || u.phoneNorm.ok)).map((u) => ({ code: u.code, name: u.person.name, phone: u.phoneNorm.ok ? u.phoneNorm.value : u.person.phone, role: u.role }));
    const targetMap = Object.fromEntries(Object.entries(S.cfg.targetMap).filter(([, v]) => v !== '' && v != null));
    const log = await MPW.fillTemplate(wb, { tree: S.tree, agg: R.agg, targetMap, splitMode: S.cfg.splitMode, users, employmentType: S.cfg.empType });
    const buf = await wb.xlsx.writeBuffer();
    await saveFile(`${S.tplName.replace(/\.xlsx$/i, '')}_filled.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    S.exportMsg = `Wrote ${plural(log.targetsWritten, 'target cell')} and ${plural(log.usersWritten, 'user')}. ${log.targetMissing.length ? plural(log.targetMissing.length, 'target row') + ' left blank (listed in the report).' : ''}`;
  } catch (err) { console.error(err); S.exportMsg = 'Could not write the template. ' + (err && err.message || err); }
  $('expStatus').textContent = S.exportMsg; btn.disabled = false;
}
function saveReport() {
  const R = S.res, T = S.tree;
  const wb = XLSX.utils.book_new();
  const tmap = Object.entries(S.cfg.targetMap).filter(([, v]) => v !== '' && v != null);
  const summary = [['Microplan', S.mpName], ['Template', S.tplName], ['Generated', new Date().toISOString()], [],
    ['Microplan rows', R.matched.length], ['Matched', R.matched.filter((m) => m.code).length], ['Not matched', R.matched.filter((m) => !m.code).length],
    ['Errors', R.issues.filter((i) => i.severity === 'error').length], ['Warnings', R.issues.filter((i) => i.severity === 'warn').length]];
  for (const [k, c] of tmap) { const r = R.agg.rolled.get(T.roots[0]); summary.push(['Total ' + k, r ? r[Number(c)] : '']); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Summary');
  const rows = [['Sheet', 'Row', 'Microplan path', 'Status', 'Failed at', 'Boundary code', 'Template path'].concat(tmap.map(([k]) => k))];
  for (const m of R.matched) rows.push([m.sheet, m.row, (m.path || []).map((p) => p.name).join(' > ') || (m.names || []).join(' > '), STATUS_LABEL[m.status] || m.status, m.failedAt >= 0 && m.path ? T.levelLabels[m.path[m.failedAt].level] + ': ' + m.path[m.failedAt].name : '', m.code || '', m.code ? T.nodes.get(m.code).path.join(' > ') : ''].concat(tmap.map(([, c]) => (m.values ? m.values[Number(c)] : ''))));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Rows');
  const dec = [['Level', 'Name in microplan', 'Parent', 'Rows', 'Status', 'Score', 'Chosen code', 'Chosen name', 'Top candidates']];
  for (const d of R.decisions) dec.push([T.levelLabels[d.level], d.name, d.parentCodes && d.parentCodes.length === 1 ? MP.label(T, d.parentCodes[0]) : '', d.count, STATUS_LABEL[d.status] || d.status, Math.round((d.score || 0) * 100) / 100, d.code || '', d.code ? T.nodes.get(d.code).name : '', (d.candidates || []).slice(0, 3).map((c) => c.name + ' (' + Math.round(c.score * 100) + '%)').join('; ')]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dec), 'Name decisions');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Severity', 'Check', 'Detail', 'Where']].concat(R.issues.map((i) => [i.severity, i.rule, i.message, i.ref]))), 'Checks');
  if (tmap.length) {
    const miss = [['Boundary code', 'Path']];
    for (const n of T.nodes.values()) { if (n.level !== T.depth || n.synthetic) continue; if (MP.valueFor(T, R.agg, n.code, Number(tmap[0][1]), S.cfg.splitMode).v == null) miss.push([n.code, n.path.join(' > ')]); }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(miss), 'No target');
  }
  if (R.users.length) {
    const u = [['Sheet', 'Row', 'Name', 'Phone (in microplan)', 'Phone (written)', 'Phone check', 'Designation', 'Role', 'Boundary code', 'Facility path']];
    for (const x of R.users) u.push([x.sheet, x.row, x.person.name, x.person.phone, x.phoneNorm.ok ? x.phoneNorm.value : '', x.phoneNorm.ok ? 'ok' : x.phoneNorm.reason, x.person.role, x.role, x.code || '', x.code ? T.nodes.get(x.code).path.join(' > ') : (x.path || []).map((p) => p.name).join(' > ') + ' (not matched)']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(u), 'Users');
  }
  if (S.edits.log.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['#', 'Edit']].concat(S.edits.log.map((e) => [e.id, e.desc]))), 'Edits');
  saveFile(`${S.mpName.replace(/\.[^.]+$/, '')}_match_report.xlsx`, new Blob([XLSX.write(wb, { type: 'array', bookType: 'xlsx' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

function clearAll() {
  Object.assign(S, { example: false, tplBuf: null, tplName: '', tree: null, facts: null, mpName: '', mpSheets: [], analyses: [], res: null, aliases: {}, exportMsg: '', step: 1, demo: null, demoMsg: '', mpOrig: [], edits: { patches: {}, removed: new Set(), added: {}, log: [], seq: 0 }, acks: new Set(), open: {} });
  S.cfg = { sheet: null, extra: [], levelMap: {}, targetMap: {}, splitMode: 'flag', userSheet: null, person: {}, userLevelMap: {}, roleMap: {}, phoneFmt: '11', empType: '', skipBadUsers: true };
}

// ───────── example: a console-style template and a microplan built in memory ─────────
async function buildExample() {
  const levels = ['Country', 'State', 'LGA', 'Ward', 'Health Facility', 'Community'];
  const keys = ['ADMIN_COUNTRY', 'ADMIN_STATE', 'ADMIN_LGA', 'ADMIN_WARD', 'ADMIN_HEALTH FACILITY', 'ADMIN_COMMUNITY'];
  const pathCode = new Map(SAMPLE.tpl.map(([p, c]) => [p, c]));
  const helper = async (codes) => 'H_' + (await MP.sha256hex(codes.join('#')));
  const hdr = (extraK, extraL) => { const k = [], l = []; keys.forEach((kk, i) => { if (i) { k.push(kk + '_HELPER'); l.push(kk + '_HELPER'); } k.push(kk); l.push(levels[i]); }); return [k.concat(extraK), l.concat(extraL)]; };
  const wb = new ExcelJS.Workbook();
  const fs = wb.addWorksheet('HCM_ADMIN_CONSOLE_FACILITIES_LI');
  const us = wb.addWorksheet('HCM_ADMIN_CONSOLE_USERS_LIST');
  const tg = wb.addWorksheet('HCM_ADMIN_CONSOLE_TARGETS');
  const rs = wb.addWorksheet('_h_Roles_h_', { state: 'hidden' });
  const bs = wb.addWorksheet('_h_Boundary_h_', { state: 'hidden' });
  let [k, l] = hdr(['HCM_ADMIN_CONSOLE_BOUNDARY_CODE', 'HCM_ADMIN_CONSOLE_FACILITY_CODE', 'HCM_ADMIN_CONSOLE_FACILITY_NAME', 'HCM_ADMIN_CONSOLE_FACILITY_TYPE', 'HCM_ADMIN_CONSOLE_FACILITY_STATUS', 'HCM_ADMIN_CONSOLE_FACILITY_CAPACITY', 'HCM_ADMIN_CONSOLE_FACILITY_USAGE'], ['Boundary Code', 'Facility Code', 'Facility Name', 'Facility Type', 'Facility Status', 'Capacity', 'Facility Usage']);
  fs.addRow(k); fs.addRow(l);
  const roleKeys = [1, 2, 3, 4, 5].map((i) => 'HCM_ADMIN_CONSOLE_USER_ROLE_MULTISELECT_' + i);
  [k, l] = hdr(['HCM_ADMIN_CONSOLE_BOUNDARY_CODE', 'HCM_ADMIN_CONSOLE_USER_NAME', 'HCM_ADMIN_CONSOLE_USER_PHONE_NUMBER'].concat(roleKeys, ['HCM_ADMIN_CONSOLE_USER_EMPLOYMENT_TYPE', 'HCM_ADMIN_CONSOLE_USER_USAGE']),
    ['Boundary Code', 'Name of the Person (Mandatory)', 'Phone Number (Mandatory)'].concat([1, 2, 3, 4, 5].map((i) => 'User Role ' + i), ['Employment Type (Mandatory)', 'Active / Inactive']));
  us.addRow(k); us.addRow(l);
  const roleList = ['Distributor', 'Health Facility Supervisor', 'Warehouse Manager', 'Field Supervisor', 'National Supervisor'];
  roleList.forEach((r) => rs.addRow([r]));
  const roleCol = k.indexOf(roleKeys[0]) + 1, empCol = k.indexOf('HCM_ADMIN_CONSOLE_USER_EMPLOYMENT_TYPE') + 1;
  for (let r = 3; r <= 80; r++) {
    for (let c = roleCol; c < roleCol + 5; c++) us.getCell(r, c).dataValidation = { type: 'list', allowBlank: true, formulae: [`'_h_Roles_h_'!$A$1:$A$${roleList.length}`] };
    us.getCell(r, empCol).dataValidation = { type: 'list', allowBlank: true, formulae: ['"Permanent,Temporary"'] };
  }
  [k, l] = hdr(['HCM_ADMIN_CONSOLE_BOUNDARY_CODE', 'HCM_ADMIN_CONSOLE_TARGET_AZM_1', 'HCM_ADMIN_CONSOLE_TARGET_AZM_2', 'HCM_ADMIN_CONSOLE_TARGET'], ['Boundary Code', 'Target 1-11 months', 'Target 12-59 months', 'Total Target']);
  tg.addRow(k); tg.addRow(l);
  for (const [p, c] of SAMPLE.tpl) {
    bs.addRow([p, c]);
    const segs = String(p).split('#');
    if (segs.length < 5) continue;
    const codes = segs.map((_, i) => pathCode.get(segs.slice(0, i + 1).join('#')));
    const row = [];
    for (let i = 0; i < 6; i++) { if (i) row.push(i < segs.length ? await helper(codes.slice(0, i)) : ''); row.push(segs[i] || ''); }
    if (segs.length === 5) fs.addRow(row.concat([c, 'F-EX-' + c.slice(-5), segs[4], 'Health Facility', 'Permanent', 100, 'Inactive']));
    else tg.addRow(row.concat([c, null, null, null]));
  }
  const tplBuf = await wb.xlsx.writeBuffer();
  const mwb = XLSX.utils.book_new();
  const md = [['Country', 'State', 'LGA', 'Ward', 'Health Facility', 'Community', 'Target population I 1-<12 months', 'Target population II 12-<59 months', 'Total Target population III']].concat(SAMPLE.mp.map((r) => r.map((v) => (v === '' ? null : v))));
  XLSX.utils.book_append_sheet(mwb, XLSX.utils.aoa_to_sheet(md), 'Master Data');
  const ul = [['Country', 'State', 'LGA', 'Ward', 'Health Facility', 'Name', 'Phone Number', 'Designation'],
    ['Nigeria', 'Gombe', 'Akko', 'AKKO', 'Akko PHCC', 'Example OIC A', '8031234567', 'OIC'],
    ['Nigeria', 'Gombe', 'Akko', 'AKKO', 'Akko PHCC', 'Example CDD A', '0812 345 6789', 'CDD'],
    ['Nigeria', 'Gombe', 'Akko', 'AKKO', 'Akko PHCC', 'Example CDD B', '0812 345 6789', 'CDD'],
    ['Nigeria', 'Gombe', 'Akko', 'Garko', 'Garko PHC', 'Example OIC B', '+2348091112223', 'OIC'],
    ['Nigeria', 'Gombe', 'Akko', 'Garko', 'Garko PHC', 'Example CDD C', '0700000000', 'CDD'],
    ['Nigeria', 'Gombe', 'Akko', 'Kalshingi', 'Kalshingi PHC', 'Example CDD D', '09065432100', 'Distributor']];
  XLSX.utils.book_append_sheet(mwb, XLSX.utils.aoa_to_sheet(ul), 'UserList');
  return { tplBuf, mpBuf: XLSX.write(mwb, { type: 'array', bookType: 'xlsx' }) };
}
async function bootExample() {
  S.busy = 'Loading example…'; render();
  try {
    const { tplBuf, mpBuf } = await buildExample();
    clearAll(); S.example = true;
    await loadTemplate(tplBuf instanceof ArrayBuffer ? tplBuf : new Uint8Array(tplBuf).slice().buffer, 'Example_Akko_Unified_Template.xlsx');
    await loadMicroplan(mpBuf, 'Example_Akko_Microplan.xlsx');
    analyse(); run(); initDemo();
  } catch (err) { console.error(err); }
  S.busy = ''; render();
}
render();
if (!window.XLSX || !window.ExcelJS) { S.busy = 'The spreadsheet libraries did not load. Check the connection and reload.'; render(); }
else if (SAMPLE) bootExample();
})();
